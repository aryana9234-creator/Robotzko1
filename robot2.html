<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management & BDD Testing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 30px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: .9;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto;
        }

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 17px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .secondary {
            background: #64748b;
            color: white;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .happy {
            background: #dcfce7;
            color: #166534;
        }

        .stressed,
        .tired {
            background: #fef3c7;
            color: #92400e;
        }

        .sad,
        .angry {
            background: #fee2e2;
            color: #991b1b;
        }

        .neutral {
            background: #e2e8f0;
            color: #475569;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: min(500px, 100%);
            border-radius: 15px;
            padding: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .test-summary {
          display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .test-stat {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
        }

        .test-stat strong {
            display: block;
            font-size: 28px;
            margin-top: 5px;
        }

        .pass {
            color: #15803d;
        }

        .fail {
            color: #dc2626;
        }

        .test-row {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .test-row.pass-row {
            border-left: 5px solid #16a34a;
        }

        .test-row.fail-row {
            border-left: 5px solid #dc2626;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        @media (max-width: 700px) {
            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 8px;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Student Management System</h1>
    <p>Python Flask + Integration BDD Testing Dashboard</p>
</header>

<div class="container">

    <!-- Controls -->

    <div class="toolbar">

        <input
            id="search"
            type="text"
            placeholder="Search student name..."
            oninput="loadStudents()"
        >

        <select id="emotion" onchange="loadStudents()">
            <option value="All">All Emotions</option>
            <option value="Happy">Happy</option>
            <option value="Neutral">Neutral</option>
            <option value="Stressed">Stressed</option>
            <option value="Tired">Tired</option>
            <option value="Sad">Sad</option>
            <option value="Angry">Angry</option>
        </select>

        <select id="status" onchange="loadStudents()">
            <option value="All">All Statuses</option>
            <option value="Studying Well">Studying Well</option>
            <option value="Break Recommended">Break Recommended</option>
            <option value="Needs Assistance">Needs Assistance</option>
        </select>

        <button class="primary" onclick="openAddModal()">
            + Add Student
        </button>

        <button class="success" onclick="runTests()">
            🧪 Run BDD Tests
        </button>

    </div>

    <!-- Student Table -->

    <div class="card">

        <h2>Students</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Emotion</th>
                    <th>Subject</th>
                    <th>Study Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

    <!-- Test Results -->

    <div class="card" id="testCard">

        <h2>🧪 Integration Test Results</h2>

        <div id="testResults">
            <div class="empty">
                Click "Run BDD Tests" to execute the Python test suite.
            </div>
        </div>

    </div>

</div>


<!-- Add/Edit Modal -->

<div class="modal" id="studentModal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-group">
                <label>Student Name</label>
                <input
                    id="studentName"
                    type="text"
                    required
                    class="badge ${emotionClass}">
                >
            </div>
               <td>${student.subject}</td>
                <label>Emotion</label>

                <select id="studentEmotion">

                    <td>${student.status}</td>
                    <option value="Happy">Happy</option>
                    <option value="Stressed">Stressed</option>
                    <option value="Tired">Tired</option>
                    <option value="Sad">Sad</option>
                    onclick='editStudent(${JSON.stringify(student)})'

                </select>
            </div>

            <div class="form-group">
                <label>Subject</label>

                <select id="studentSubject">

                    <option>Mathematics</option>
                    <option>Physics</option>
                    <option>Chemistry</option>
                    <option>Programming</option>
                    <option>Robotics</option>
                    <option>Electronics</option>

                </select>
            </div>

            <div class="form-group">
                <label>Study Time (minutes)</label>

                <input
                    id="studentStudyTime"
                    type="number"
                    min="0"
                    max="1000"
                    value="30"
                >
            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary"
                >
                    Save Student
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    // ---------------------------------------------
    // Load Students
    // ---------------------------------------------

    async function loadStudents() {
    const search = document.getElementById("search").value;
    const emotion = document.getElementById("emotion").value;
    const status = document.getElementById("status").value;

    try {
        const response = await fetch(
            `/api/students?search=${encodeURIComponent(search)}&emotion=${encodeURIComponent(emotion)}&status=${encodeURIComponent(status)}`
        );

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const students = await response.json();
        const table = document.getElementById("studentTable");

        // ...render table here
    } catch (error) {
        console.error("Failed to load students:", error);
    }
}
        {if (id) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        No students found.
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML = students.map(student => {

            const emotionClass =
                student.emotion.toLowerCase();

            return `
                <tr>

                    <td>${student.id}</td>

                    <td>
                        <strong>${escapeHtml(student.name)}</strong>
                    </td>

                    <td>
                        <span class="badge ${emotionClass}">
                            ${student.emotion}
                        </span>
                    </td>

                    <td>${student.subject}</td>

                    <td>${student.studyTime} min</td>

                    <td>${student.status}</td>

                    <td>

                        <button
                            class="primary"
                            onclick='editStudent(${JSON.stringify(student)})'
                        >
                            Edit
                        </button>

                        <button
                            class="danger"
                            onclick="deleteStudent(${student.id})"
                        >
                            Delete
                        </button>

                    </td>

                </tr>
            `;

        }).join("");
    }


    // ---------------------------------------------
    // Add Modal
    // ---------------------------------------------

    function openAddModal() {

        document.getElementById("modalTitle").textContent =
            "Add Student";

        document.getElementById("studentId").value = "";

        document.getElementById("studentName").value = "";

        document.getElementById("studentEmotion").value =
            "Neutral";

        const percentage =
    Math.round(
        (results.passed / results.total) * 100
    );document.getElementById("studentSubject").value =
            "Mathematics";

        document.getElementById("studentStudyTime").value =
            30;

        document.getElementById("studentModal").style.display =
            "flex";
    }


    // ---------------------------------------------
    // Edit Modal
    // ---------------------------------------------

    function editStudent(student) {

        document.getElementById("modalTitle").textContent =
            "Edit Student";

        document.getElementById("studentId").value =
            student.id;

        document.getElementById("studentName").value =
            student.name;

        document.getElementById("studentEmotion").value =
            student.emotion;

        document.getElementById("studentSubject").value =
            student.subject;

        document.getElementById("studentStudyTime").value =
            student.studyTime;

        document.getElementById("studentModal").style.display =
            "flex";
    }


    // ---------------------------------------------
    // Close Modal
    // ---------------------------------------------

    function closeModal() {

        document.getElementById("studentModal").style.display =
            "none";
    }


    // ---------------------------------------------
    // Submit Add/Edit
    // ---------------------------------------------

    document.getElementById("studentForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const id =
                document.getElementById("studentId").value;

            const student = {

                name:
                    document.getElementById("studentName").value,

                emotion:
                    document.getElementById("studentEmotion").value,

                subject:
                    document.getElementById("studentSubject").value,

                studyTime:
                    Number(
                        document.getElementById("studentStudyTime").value
                    )

            };

            let response;

            if (id) {

                response = await fetch(
                    `/api/students/${id}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(student)
                    }
                );

            } else {

                response = await fetch(
                    "/api/students",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(student)
                    }
                );

            }

            const result = await response.json();

            if (!result.success) {

                alert(result.error);
                return;
            }

            closeModal();
            loadStudents();
        });


    // ---------------------------------------------
    // Delete
    // ---------------------------------------------

    async function deleteStudent(id) {

        if (!confirm("Delete this student?")) {
            return;
        }

        const response = await fetch(
            `/api/students/${id}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!result.success) {
            alert("Student could not be deleted.");
            return;
        }

        loadStudents();
    }


    // ---------------------------------------------
    // Run BDD Tests
    // ---------------------------------------------

    async function runTests() {

        const resultsContainer =
            document.getElementById("testResults");

        resultsContainer.innerHTML = `
            <div class="empty">
                ⏳ Running Python BDD tests...
            </div>
        `;

        const response = await fetch(
            "/api/tests",
            {
                method: "POST"
            }
        );

        const results = await response.json();

        const percentage =
            Math.round(
                (results.passed / results.total) * 100
            );

        resultsContainer.innerHTML = `

            <div class="test-summary">

                <div class="test-stat">
                    Total
                    <strong>${results.total}</strong>
                </div>

                <div class="test-stat">
                    Passed
                    <strong class="pass">
                        ${results.passed}
                    </strong>
                </div>

                <div class="test-stat">
                    Failed
                    <strong class="fail">
                        ${results.failed}
                    </strong>
                </div>

                <div class="test-stat">
                    Pass Rate
                    <strong>${percentage}%</strong>
                </div>

            </div>

            <div>

                ${results.tests.map(test => `

                    <div class="
                        test-row
                        ${test.passed
                            ? "pass-row"
                            : "fail-row"}
                    ">

                        ${test.passed ? "✅" : "❌"}

                        <strong>
                            ${escapeHtml(test.name)}
                        </strong>

                        ${
                            test.error
                            ? `<div class="fail">
                                ${escapeHtml(test.error)}
                               </div>`
                            : ""
                        }

                    </div>

                `).join("")}

            </div>
        `;
    }


    // ---------------------------------------------
    // Basic HTML escaping
    // ---------------------------------------------

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    // ---------------------------------------------
    // Initial Load
    // ---------------------------------------------

    loadStudents();

</script>

</body>
</html>
